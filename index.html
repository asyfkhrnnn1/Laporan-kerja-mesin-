<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Jam Kerja Mesin – Workshop Mold</title>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7785;--pri:#1f6feb;--ok:#1a7f4b;--bd:#d6dce3}
  @media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--tx:#e8edf2;--mut:#93a0ae;--pri:#4c8dff;--ok:#3fb67a;--bd:#2f3946}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px}
  .card{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
  h1{font-size:1.2rem;margin:0 0 14px}
  label.t{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 6px}
  input[type=date],input[type=text],select{width:100%;padding:11px;font-size:1rem;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx)}
  .shift{margin-top:20px;border-top:2px solid var(--bd);padding-top:12px}
  .shift h2{font-size:1.05rem;margin:0}
  .shift .sub{font-size:.85rem;color:var(--mut);margin-bottom:4px}
  .row{display:flex;gap:8px;align-items:center;margin:8px 0}
  .row .tot{margin-left:auto;font-size:.88rem;color:var(--mut)}
  .jam{border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--bg)}
  .jam.on{border-color:var(--pri)}
  .jam label{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
  .jam input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);margin:0}
  .jam .ket{margin-top:7px;padding:9px;font-size:.92rem}
  button{font:inherit;padding:8px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;font-size:.88rem}
  button.main{width:100%;margin-top:18px;padding:12px;background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600;font-size:1rem}
  button:disabled{opacity:.6}
  .gtotal{margin-top:16px;font-weight:600}
  #msg{margin-top:12px;font-size:.92rem;min-height:1.2em}
  .ok{color:var(--ok)} .err{color:#d1453b}
</style>
</head>
<body>
<div class="card">
  <h1>Input Jam Kerja Mesin</h1>

  <label class="t" for="tgl">Tanggal</label>
  <input type="date" id="tgl">

  <label class="t" for="mesin">Nama Mesin</label>
  <select id="mesin"></select>

  <div id="shifts"></div>

  <div class="gtotal" id="gtotal">Total semua shift: 0 jam</div>
  <button class="main" id="simpan">Simpan</button>
  <div id="msg"></div>
</div>

<script>
// ====== GANTI dengan URL Web App dari Google Apps Script ======
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwiutv0yffwgzExpy7_aWPUNexaheqWGDzWv60kCeSSrr9LRsatXlo3vliv5nsTUI0H/exec";
// ==============================================================

const MESIN = ["CNC 1","CNC 2","CNC 3","Milling 1","Milling 2","EDM 1","EDM 3","EDM 4","Mesin Bubut"];
const SHIFT = [
  { no:1, nama:"Shift 1", rentang:"00.00 – 08.00", mulai:0 },
  { no:2, nama:"Shift 2", rentang:"08.00 – 16.00", mulai:8 },
  { no:3, nama:"Shift 3", rentang:"16.00 – 00.00", mulai:16 }
];
const $ = id => document.getElementById(id);
const pad = n => String(n % 24).padStart(2,"0");

$("mesin").innerHTML = MESIN.map(m => `<option>${m}</option>`).join("");
const t = new Date();
$("tgl").value = t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");

SHIFT.forEach(s => {
  const sec = document.createElement("div");
  sec.className = "shift"; sec.id = "shift"+s.no;
  let jamHtml = "";
  for (let h = s.mulai; h < s.mulai + 8; h++) {
    jamHtml += `<div class="jam">
      <label><input type="checkbox" class="cb"> ${pad(h)}.00 – ${pad(h+1)}.00</label>
      <input type="text" class="ket" placeholder="Catatan / keterangan (mis. off: tunggu material)">
    </div>`;
  }
  sec.innerHTML = `<h2>${s.nama}</h2><div class="sub">${s.rentang}</div>
    <label class="t" for="mp${s.no}">Nama Manpower ${s.nama}</label>
    <input type="text" id="mp${s.no}" placeholder="Nama operator" autocomplete="off">
    <div class="row">
      <button type="button" data-a="all">Pilih semua</button>
      <button type="button" data-a="none">Hapus semua</button>
      <span class="tot">0 jam</span>
    </div>${jamHtml}`;
  $("shifts").appendChild(sec);
});

const rows = () => [...document.querySelectorAll(".jam")];
const update = () => {
  let all = 0;
  SHIFT.forEach(s => {
    const sec = $("shift"+s.no);
    const n = [...sec.querySelectorAll(".cb")].filter(c => c.checked).length;
    sec.querySelector(".tot").textContent = n + " jam";
    all += n;
  });
  rows().forEach(r => r.classList.toggle("on", r.querySelector(".cb").checked));
  $("gtotal").textContent = "Total semua shift: " + all + " jam";
};
$("shifts").addEventListener("change", update);
$("shifts").addEventListener("click", e => {
  const a = e.target.dataset && e.target.dataset.a;
  if (!a) return;
  e.target.closest(".shift").querySelectorAll(".cb").forEach(c => c.checked = (a === "all"));
  update();
});

$("simpan").onclick = async () => {
  const msg = $("msg");
  if (!$("tgl").value) { msg.className="err"; msg.textContent="Pilih tanggal dulu."; return; }
  if (SCRIPT_URL.startsWith("PASTE")) { msg.className="err"; msg.textContent="URL Google Apps Script belum diisi."; return; }
  const manpower = SHIFT.map(s => $("mp"+s.no).value.trim());
  const jam = rows().map(r => r.querySelector(".cb").checked ? 1 : 0);
  const ket = rows().map(r => r.querySelector(".ket").value.trim());
  // Nama manpower wajib untuk shift yang ada jam/catatannya
  for (let i = 0; i < 3; i++) {
    const terisi = jam.slice(i*8, i*8+8).some(x => x) || ket.slice(i*8, i*8+8).some(x => x);
    if (terisi && !manpower[i]) { msg.className="err"; msg.textContent="Isi nama manpower " + SHIFT[i].nama + "."; return; }
  }
  const data = { tanggal: $("tgl").value, mesin: $("mesin").value, manpower, jam, ket };
  $("simpan").disabled = true; msg.className=""; msg.textContent="Menyimpan...";
  try {
    await fetch(SCRIPT_URL, { method:"POST", mode:"no-cors",
      headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(data) });
    msg.className="ok";
    msg.textContent = "Tersimpan: " + data.mesin + ", " + data.tanggal + " (" + jam.filter(Boolean).length + " jam)";
  } catch (e) {
    msg.className="err"; msg.textContent="Gagal menyimpan. Cek koneksi / URL script.";
  }
  $("simpan").disabled = false;
};
</script>
</body>
</html>
