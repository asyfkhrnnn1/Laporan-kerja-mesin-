<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Jam Kerja Mesin – Workshop Mold</title>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7785;--pri:#1f6feb;--ok:#1a7f4b;--bd:#d6dce3}
  @media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--tx:#e8edf2;--mut:#93a0ae;--pri:#4c8dff;--ok:#3fb67a;--bd:#2f3946}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px}
  .card{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
  h1{font-size:1.2rem;margin:0 0 14px}
  label.t{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 6px}
  input[type=date],input[type=text],select{width:100%;padding:11px;font-size:1rem;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx)}
  .shift{margin-top:20px;border-top:2px solid var(--bd);padding-top:12px}
  .shift h2{font-size:1.05rem;margin:0}
  .shift .sub{font-size:.85rem;color:var(--mut);margin-bottom:4px}
  .row{display:flex;gap:8px;align-items:center;margin:8px 0}
  .row .tot{margin-left:auto;font-size:.88rem;color:var(--mut)}
  .jam{border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--bg)}
  .jam.on{border-color:var(--pri)}
  .jam label{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
  .jam input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);margin:0}
  .jam .ket{margin-top:7px;padding:9px;font-size:.92rem}
  button{font:inherit;padding:8px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;font-size:.88rem}
  button.main{width:100%;margin-top:18px;padding:12px;background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600;font-size:1rem}
  button:disabled{opacity:.6}
  .gtotal{margin-top:16px;font-weight:600}
  #msg{margin-top:12px;font-size:.92rem;min-height:1.2em}
  .ok{color:var(--ok)} .err{color:#d1453b}
</style>
